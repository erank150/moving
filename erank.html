<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מעבר דירה – משימות</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mut:#6b7280;--bd:#e4e0d8;--ac:#2f6f5e;--hi:#c0392b;--md:#b9770e;--lo:#2471a3;--r-bg:#fde2e0;--r-tx:#a93226;--r-bd:#f1a9a3;--y-bg:#fff1b8;--y-tx:#7a5600;--y-bd:#f0cf4a;--g-bg:#d6f2df;--g-tx:#1c7a44;--g-bd:#95d5ae;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--card:#1f242d;--tx:#eceff4;--mut:#9aa3b2;--bd:#2f3541;--ac:#4fb597;--hi:#ec7063;--md:#e0a33a;--lo:#5dade2;--r-bg:#4a2523;--r-tx:#f5b7b1;--r-bd:#7b3a36;--y-bg:#473c15;--y-tx:#f7dc6f;--y-bd:#776621;--g-bg:#1f3d2b;--g-tx:#82e0aa;--g-bd:#2f6a47;}}
:root[data-theme="dark"]{--bg:#15181e;--card:#1f242d;--tx:#eceff4;--mut:#9aa3b2;--bd:#2f3541;--ac:#4fb597;--hi:#ec7063;--md:#e0a33a;--lo:#5dade2;--r-bg:#4a2523;--r-tx:#f5b7b1;--r-bd:#7b3a36;--y-bg:#473c15;--y-tx:#f7dc6f;--y-bd:#776621;--g-bg:#1f3d2b;--g-tx:#82e0aa;--g-bd:#2f6a47;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:0 14px 110px;max-width:720px;margin-inline:auto}
h1{font-size:22px;margin:18px 0 6px}
#cnt{color:var(--mut);font-size:14px}
.prog{height:8px;background:var(--bd);border-radius:6px;margin:8px 0 14px;overflow:hidden}
#bar{height:100%;width:0;background:var(--ac);transition:width .3s}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--tx);padding:9px 14px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.hd{font-size:14px;color:var(--mut);display:flex;gap:6px;align-items:center}
h2{font-size:16px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{color:var(--mut);font-weight:400;font-size:13px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.chk{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:transparent;font-size:18px;cursor:pointer;padding:0}
.done .chk{background:var(--ac);border-color:var(--ac);color:#fff}
.body{flex:1;min-width:0;cursor:pointer}
.title{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.sub{color:var(--mut);font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.done{opacity:.55}.done .title{text-decoration:line-through}
.chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--mut)}
.pbtn{flex:none;align-self:center;font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:999px;border:1.5px solid;cursor:pointer}
.pbtn.p0{background:var(--r-bg);color:var(--r-tx);border-color:var(--r-bd)}.pbtn.p1{background:var(--y-bg);color:var(--y-tx);border-color:var(--y-bd)}.pbtn.p2{background:var(--g-bg);color:var(--g-tx);border-color:var(--g-bd)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
#add{display:block;width:100%;max-width:720px;margin:auto;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:600;padding:15px;cursor:pointer}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--tx);width:min(94vw,520px);padding:18px;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;cursor:pointer}
.row .pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.row .del{color:var(--hi);flex:none}
#err{color:var(--hi);font-size:13px;min-height:16px;margin-top:6px}
</style>
</head>
<body>
<h1>🏠 מעבר דירה – משימות</h1>
<div id="cnt">טוען…</div>
<div class="prog"><div id="bar"></div></div>
<div class="ctl">
  <div class="seg"><button id="m-cat" class="on">לפי קטגוריה</button><button id="m-pri">לפי עדיפות</button></div>
  <label class="hd"><input type="checkbox" id="hide" style="width:auto"> הסתר שבוצעו</label>
</div>
<div id="list"></div>
<div class="bar"><button id="add">＋ הוסף משימה</button></div>

<dialog id="dlg">
  <h3 id="dt">משימה חדשה</h3>
  <label>קטגוריה</label><input id="f-cat" list="cats" autocomplete="off"><datalist id="cats"></datalist>
  <label>משימה</label><input id="f-task">
  <label>פרטים</label><textarea id="f-det"></textarea>
  <label>עדיפות</label>
  <select id="f-pri"><option value="">ללא</option><option>גבוהה</option><option>בינונית</option><option>נמוכה</option></select>
  <label>הערות</label><textarea id="f-note"></textarea>
  <div id="err"></div>
  <div class="row"><button class="pri" id="save">שמור</button><button id="cancel">ביטול</button><button class="del" id="del" hidden>מחק</button></div>
</dialog>

<script>
const PRI=['גבוהה','בינונית','נמוכה'];
let db=null,tasks=[],mode='cat',hideDone=false,editId=null,canWrite=true;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pi=n=>{const i=PRI.indexOf(n);return i<0?3:i};

function render(){
  const done=tasks.filter(t=>t.done).length;
  $('#cnt').textContent=tasks.length?done+' מתוך '+tasks.length+' משימות בוצעו':'אין משימות עדיין';
  $('#bar').style.width=(tasks.length?done/tasks.length*100:0)+'%';
  $('#cats').innerHTML=[...new Set(tasks.map(t=>t.cat).filter(Boolean))].map(c=>'<option value="'+esc(c)+'">').join('');
  const key=t=>mode==='cat'?(t.cat||'ללא קטגוריה'):(t.pri||'ללא עדיפות');
  const groups={};
  tasks.filter(t=>!(hideDone&&t.done)).forEach(t=>(groups[key(t)]=groups[key(t)]||[]).push(t));
  const none=mode==='cat'?'ללא קטגוריה':'ללא עדיפות';
  const names=Object.keys(groups).sort((a,b)=>{
    if(mode==='pri')return pi(a)-pi(b);
    if(a===none)return 1; if(b===none)return -1; return a.localeCompare(b,'he');
  });
  if(!names.length){$('#list').innerHTML='<div class="empty">'+(tasks.length?'כל המשימות בוצעו 🎉':'לחצו על "הוסף משימה" כדי להתחיל')+'</div>';return}
  $('#list').innerHTML=names.map(n=>{
    const g=groups[n].sort((a,b)=>(!!a.done-!!b.done)||(mode==='cat'?pi(a.pri)-pi(b.pri):(a.cat||'~').localeCompare(b.cat||'~','he'))||((a.o||0)-(b.o||0)));
    const d=g.filter(t=>t.done).length;
    return '<h2>'+esc(n)+'<small>'+d+'/'+g.length+'</small></h2>'+g.map(t=>
      '<div class="card'+(t.done?' done':'')+'" data-id="'+t.id+'"><button class="chk" data-act="tog" aria-label="סמן כבוצע">✓</button><div class="body" data-act="edit"><div class="title">'+esc(t.task||t.cat||'(ללא שם)')+'</div>'+
      (t.details?'<div class="sub">'+esc(t.details)+'</div>':'')+(t.notes?'<div class="sub">📝 '+esc(t.notes)+'</div>':'')+
      (mode==='pri'&&t.cat?'<div class="chips"><span class="chip">'+esc(t.cat)+'</span></div>':'')+'</div>'+(t.pri?'<button class="pbtn p'+pi(t.pri)+'" data-act="edit">'+esc(t.pri)+'</button>':'')+'</div>').join('');
  }).join('');
}

function openDlg(id){
  editId=id;const t=tasks.find(x=>x.id===id)||{};
  $('#dt').textContent=id?'עריכת משימה':'משימה חדשה';
  $('#f-cat').value=t.cat||'';$('#f-task').value=t.task||'';$('#f-det').value=t.details||'';$('#f-pri').value=t.pri||'';$('#f-note').value=t.notes||'';
  $('#del').hidden=!id;$('#err').textContent='';$('#dlg').showModal();
}
async function save(){
  const v={cat:$('#f-cat').value.trim(),task:$('#f-task').value.trim(),details:$('#f-det').value.trim(),pri:$('#f-pri').value,notes:$('#f-note').value.trim()};
  if(!Object.values(v).some(Boolean)){$('#err').textContent='יש למלא לפחות שדה אחד';return}
  try{
    if(editId)await db.doc('tasks/'+editId).update(v);
    else await db.collection('tasks').add({...v,done:false,o:Date.now()});
    $('#dlg').close();
  }catch(e){$('#err').textContent='השמירה נכשלה – ייתכן שאין לך הרשאת עריכה'}
}
$('#add').onclick=()=>openDlg(null);
$('#save').onclick=save;$('#cancel').onclick=()=>$('#dlg').close();
$('#del').onclick=async()=>{if(confirm('למחוק את המשימה?')){try{await db.doc('tasks/'+editId).delete();$('#dlg').close()}catch(e){$('#err').textContent='המחיקה נכשלה'}}};
$('#m-cat').onclick=()=>{mode='cat';$('#m-cat').className='on';$('#m-pri').className='';render()};
$('#m-pri').onclick=()=>{mode='pri';$('#m-pri').className='on';$('#m-cat').className='';render()};
$('#hide').onchange=e=>{hideDone=e.target.checked;render()};
$('#list').onclick=async e=>{
  const el=e.target.closest('[data-act]');if(!el||!canWrite)return;
  const id=el.closest('.card').dataset.id;
  if(el.dataset.act==='edit')return openDlg(id);
  const t=tasks.find(x=>x.id===id);
  try{await db.doc('tasks/'+id).update({done:!t.done})}catch(err){}
};

(async()=>{
  try{db=await claude.use('db')}catch(e){}
  if(!db){$('#cnt').textContent='';$('#list').innerHTML='<div class="empty">כדי לראות ולערוך את המשימות צריך להתחבר לחשבון Claude ולפתוח את הקישור שוב.</div>';$('.bar').hidden=true;return}
  try{const u=await claude.use('user');if(u&&(await u.can('data.write'))===false){canWrite=false;$('.bar').hidden=true}}catch(e){}
  db.collection('tasks').onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{$('#cnt').textContent='שגיאה בטעינת הנתונים'});
})();
</script>
</body>
</html>
